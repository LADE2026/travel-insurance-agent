{% extends "base.html" %}
{% block titulo %}Entrar · {{ EMPRESA_NOMBRE }}{% endblock %}
{% block contenido %}
<div class="tarjeta entrar">
  <h1>Entrar</h1>
  {% if form.errors %}<div class="aviso rojo">El correo o la contraseña no son correctos.</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="campo" style="margin-bottom:16px"><label for="id_username">Correo</label><input type="email" name="username" id="id_username" autocomplete="email" required autofocus value="{{ form.username.value|default:'' }}"></div>
    <div class="campo" style="margin-bottom:20px"><label for="id_password">Contraseña</label><input type="password" name="password" id="id_password" autocomplete="current-password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="boton" type="submit" style="width:100%">Entrar</button>
  </form>
</div>
{% endblock %}
