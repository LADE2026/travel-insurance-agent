# Instrucciones para Render: qué servidores crear.
databases:
  - name: saf-db
    plan: basic-256mb
    databaseName: saf
    user: saf

services:
  - type: web
    name: strategy-auto-flow
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DATABASE_URL
        fromDatabase:
          name: saf-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMPRESA_EMAIL
        value: info@strategyautoflow.com
